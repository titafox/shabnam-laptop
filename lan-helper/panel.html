<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>开放桌面控制台</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 15px/1.45 ui-sans-serif, system-ui, sans-serif; background: #12151c; color: #e7ecf5; }
  header { display: flex; justify-content: space-between; gap: 16px; align-items: center; padding: 18px 22px; border-bottom: 1px solid #2a3140; }
  h1 { font-size: 20px; margin: 0; font-weight: 650; }
  main { display: grid; grid-template-columns: 340px 1fr; gap: 18px; padding: 18px 22px 32px; }
  section { background: #1b212c; border: 1px solid #2c3444; border-radius: 12px; padding: 14px; }
  h2 { margin: 0 0 10px; font-size: 13px; letter-spacing: .04em; color: #9aa6bb; font-weight: 650; }
  button, input { font: inherit; }
  button { background: #2c3648; color: #e7ecf5; border: 0; border-radius: 8px; padding: 8px 10px; cursor: pointer; }
  button:hover { background: #3a4660; }
  button.primary { background: #2f6fed; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  label { display: block; color: #9aa6bb; font-size: 12px; margin: 8px 0 4px; }
  .line { display: flex; gap: 8px; }
  input { flex: 1; background: #12151c; color: inherit; border: 1px solid #344055; border-radius: 8px; padding: 8px 10px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: #6b7280; margin-right: 6px; }
  .dot.on { background: #3dd68c; }
  dl { display: grid; grid-template-columns: 92px 1fr; gap: 4px 8px; margin: 0; }
  dt { color: #9aa6bb; }
  dd { margin: 0; overflow-wrap: anywhere; }
  img { width: 100%; background: #0c0e13; border-radius: 8px; min-height: 120px; }
  ul { list-style: none; padding: 0; margin: 8px 0 0; max-height: 420px; overflow: auto; }
  li { padding: 6px 0; border-top: 1px solid #2a3140; cursor: pointer; }
  li small { color: #9aa6bb; }
  #msg { color: #f0c674; min-height: 1.2em; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
</style>
<header>
  <h1>开放桌面控制台</h1>
  <div id="link"><span class="dot"></span>正在连接</div>
</header>
<main>
  <div>
    <section>
      <h2>设备</h2>
      <dl id="meta"></dl>
      <p id="msg"></p>
    </section>
    <section style="margin-top:12px">
      <h2>操作</h2>
      <div class="row">
        <button data-cmd="inspect">刷新状态</button>
        <button data-cmd="list">应用列表</button>
        <button class="primary" data-cmd="screenshot">截图</button>
        <button data-cmd="shotsetup">授权投屏</button>
        <button data-cmd="home">桌面设置</button>
        <button data-cmd="usb-settings">USB 设置</button>
        <button data-cmd="open android.settings.WIFI_SETTINGS">Wi-Fi</button>
        <button data-cmd="open android.settings.APPLICATION_DEVELOPMENT_SETTINGS">开发者选项</button>
        <button data-cmd="launch com.shcmcc.swdevicemanger">终端管理</button>
      </div>
      <label>打开应用（包名）</label>
      <div class="line"><input id="pkg" placeholder="com.android.settings"><button id="go-pkg">打开</button></div>
      <label>打开网页</label>
      <div class="line"><input id="url" placeholder="https://"><button id="go-url">打开</button></div>
      <label>打开组件</label>
      <div class="line"><input id="cmp" placeholder="包名/类名"><button id="go-cmp">打开</button></div>
    </section>
  </div>
  <div>
    <section>
      <h2>画面</h2>
      <img id="shot" alt="最近一次截图">
    </section>
    <section style="margin-top:12px">
      <h2 id="list-title">应用</h2>
      <ul id="list"></ul>
    </section>
  </div>
</main>
<script>
const meta = document.getElementById('meta');
const list = document.getElementById('list');
let shotMtime = 0;

function field(k, v) {
  return '<dt>' + k + '</dt><dd>' + (v == null || v === '' ? '—' : v) + '</dd>';
}
async function send(command) {
  document.getElementById('msg').textContent = '下发 ' + command;
  const r = await fetch('/api/cmd', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({command})});
  const j = await r.json();
  document.getElementById('msg').textContent = r.ok ? ('已下发 ' + j.queued) : (j.error || '失败');
}
document.querySelectorAll('button[data-cmd]').forEach(b => b.onclick = () => send(b.dataset.cmd));
document.getElementById('go-pkg').onclick = () => { const v = document.getElementById('pkg').value.trim(); if (v) send('launch ' + v); };
document.getElementById('go-url').onclick = () => { const v = document.getElementById('url').value.trim(); if (v) send('url ' + v); };
document.getElementById('go-cmp').onclick = () => { const v = document.getElementById('cmp').value.trim(); if (v) send('start ' + v); };

function renderList(s) {
  const items = s.packages || s.activities;
  if (!items) { list.innerHTML = ''; return; }
  document.getElementById('list-title').textContent = s.packages ? ('应用 ' + s.packages.length) : ('Activity ' + s.activities.length);
  if (s.packages) {
    const rows = s.packages.slice().sort((a,b) => (a.label||'').localeCompare(b.label||'', 'zh'));
    list.innerHTML = rows.map(p => '<li data-pkg="' + p.pkg + '"><b>' + (p.label||p.pkg) + '</b><br><small>' + p.pkg + (p.enabled ? '' : ' · 已停用') + '</small></li>').join('');
    list.querySelectorAll('li').forEach(li => li.onclick = () => { document.getElementById('pkg').value = li.dataset.pkg; send('launch ' + li.dataset.pkg); });
  } else {
    list.innerHTML = s.activities.map(a => '<li><small>' + (a.name || a.error) + '</small></li>').join('');
  }
}
async function tick() {
  const s = await fetch('/api/state').then(r => r.json());
  const link = document.getElementById('link');
  link.innerHTML = '<span class="dot' + (s.online ? ' on' : '') + '"></span>' + (s.online ? '设备在线' : '设备未上报') + (s.client ? ' · ' + s.client : '');
  const p = s.properties || {};
  meta.innerHTML = field('型号', s.model) + field('系统', s.android) + field('最近指令', s.exec)
    + field('悬浮窗', s.overlay) + field('投屏', s.projection)
    + field('USB 调试', s.adb_enabled) + field('网络端口', p['service.adb.tcp.port'])
    + field('adbd', p['init.svc.adbd']);
  renderList(s);
  if (s.shot && s.shot_mtime !== shotMtime) {
    shotMtime = s.shot_mtime;
    document.getElementById('shot').src = '/api/shot?t=' + shotMtime;
  }
}
tick();
setInterval(tick, 2000);
</script>
</html>
