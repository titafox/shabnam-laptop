# /etc/ntpd-rs/shabnam.toml — used by shabnam-timesync
[observability]
log-level = "warn"
observation-path = "/run/ntpd-rs/observe"

# ntpd-rs.pool.ntp.org hands out a single address from here, so ask several names.
[[source]]
mode = "pool"
address = "pool.ntp.org"
count = 3

[[source]]
mode = "server"
address = "time.cloudflare.com"

[[source]]
mode = "server"
address = "ntp.aliyun.com"

[synchronization]
minimum-agreeing-sources = 2
single-step-panic-threshold = 1800
# The RTC battery may be flat one day: accept any jump at start-up.
startup-step-panic-threshold = { forward = "inf", backward = "inf" }
