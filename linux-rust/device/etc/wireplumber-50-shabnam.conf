# /etc/wireplumber/wireplumber.conf.d/50-shabnam.conf
# Only the built-in rk809 codec; no Bluetooth, no camera monitors, no D-Bus needed.
wireplumber.profiles = {
  main = {
    hardware.bluetooth = disabled
    monitor.libcamera = disabled
    monitor.alsa-midi = disabled
    support.dbus = disabled
    support.system-dbus = disabled
    support.logind = disabled
    support.reserve-device = disabled
    monitor.alsa.reserve-device = disabled
    support.portal-permissionstore = disabled
    script.client.access-portal = disabled
  }
}
monitor.alsa.rules = [
  {
    # bt-sco and HDMI cards would otherwise compete for "default output"
    matches = [
      { device.name = "alsa_card.platform-bt-sound" }
      { device.name = "alsa_card.platform-hdmi-sound" }
    ]
    actions = { update-props = { device.disabled = true } }
  }
  {
    matches = [ { node.name = "~alsa_output.platform-rk809-sound.*" } ]
    actions = { update-props = { node.description = "Shabnam speaker / headphones", priority.session = 2000 } }
  }
  {
    matches = [ { node.name = "~alsa_input.platform-rk809-sound.*" } ]
    actions = { update-props = { node.description = "Shabnam microphone" } }
  }
]
