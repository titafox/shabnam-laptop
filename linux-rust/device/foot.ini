# foot terminal for Shabnam — install as /root/.config/foot/foot.ini
# foot draws with the processor (no GPU), so it works on this machine's graphics driver,
# and it draws its own title bar with a close button.
[main]
shell=/usr/bin/fish
font=DejaVu Sans Mono:size=11, Noto Sans Mono CJK SC:size=11, Symbols Nerd Font Mono:size=11
pad=8x8
term=xterm-256color

[csd]
preferred=client
size=30
color=ff0b2440
button-color=ffe8f4f8
button-width=34
font=Noto Sans CJK SC:size=10

[cursor]
style=beam
blink=yes

[colors-dark]
background=061a33
foreground=e8f4f8
selection-foreground=061a33
selection-background=12c8c4
regular0=0b2440
regular1=ff6b6b
regular2=5fd7a7
regular3=ffc857
regular4=5aa9ff
regular5=c792ea
regular6=12c8c4
regular7=c8d8e4
bright0=4f6b82
bright1=ff8a8a
bright2=7fe7bf
bright3=ffd97a
bright4=82c0ff
bright5=d9b0f5
bright6=5fe3df
bright7=ffffff

[mouse]
hide-when-typing=yes
