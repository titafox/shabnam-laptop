[package]
name = "shabnam-shell"
version = "0.1.0"
edition = "2021"
description = "Desktop shell of the Shabnam laptop: shelf, launcher panel and quick-settings panel, software-drawn (wl_shm) on wlr-layer-shell"

[dependencies]
smithay-client-toolkit = "0.19"
wayland-client = "0.31"
ab_glyph = { version = "0.2", features = ["variable-fonts"] }
ttf-parser = "0.25"
png = "0.17"
resvg = { version = "0.49", default-features = false, features = ["raster-images"] }
serde_json = "1"
memmap2 = "0.9"
libc = "0.2"

[profile.release]
opt-level = 2
strip = true
