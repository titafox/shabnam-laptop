<!doctype html>
<meta charset="utf-8">
<title>VAT loading</title>
<style>html,body{margin:0;height:100%;background:#061a33}video{width:100%;height:100%;object-fit:contain}</style>
<video id="v" muted playsinline loop></video>
<script>
// Plays each clip for SECONDS and writes the playback numbers into the window title once a second:
//   VAT p=<clip> t=<seconds playing> tot=<frames shown+dropped> drop=<dropped> pe=<1 if the browser calls
//   this decode "power efficient", i.e. a hardware decoder is offered> w=<decoded width>
// and at the end:  VAT done 30=<tot>/<drop> 60=<tot>/<drop> pe=<..>
const DIR = 'file:///var/tmp/pltest/', SECONDS = 22;
const clips = [['30', 'h264_1080p30.mp4', 30], ['60', 'h264_1080p60.mp4', 60]];
const v = document.getElementById('v'), done = [];
let i = -1, pe = '?', t0 = 0, base = {totalVideoFrames: 0, droppedVideoFrames: 0}, timer = 0;
function numbers() {
  const q = v.getVideoPlaybackQuality();
  return [q.totalVideoFrames - base.totalVideoFrames, q.droppedVideoFrames - base.droppedVideoFrames];
}
function next() {
  clearInterval(timer);
  if (i >= 0) { const [tot, drop] = numbers(); done.push(clips[i][0] + '=' + tot + '/' + drop); }
  if (++i >= clips.length) { v.pause(); document.title = 'VAT done ' + done.join(' ') + ' pe=' + pe; return; }
  const [name, file, fps] = clips[i];
  pe = '?'; t0 = 0;
  navigator.mediaCapabilities.decodingInfo({type: 'file', video: {contentType: 'video/mp4; codecs="avc1.64002a"',
    width: 1920, height: 1080, bitrate: 8000000, framerate: fps}}).then(r => { pe = r.powerEfficient ? 1 : 0; }, () => { pe = 'x'; });
  document.title = 'VAT p=' + name + ' starting';
  v.src = DIR + file;
  v.play().catch(e => { document.title = 'VAT error play ' + e.name; });
  timer = setInterval(() => {
    if (!t0) return;
    const t = (performance.now() - t0) / 1000, [tot, drop] = numbers();
    document.title = 'VAT p=' + name + ' t=' + t.toFixed(0) + ' tot=' + tot + ' drop=' + drop + ' pe=' + pe + ' w=' + v.videoWidth;
    if (t >= SECONDS) next();
  }, 1000);
}
v.addEventListener('playing', () => { if (!t0) { t0 = performance.now(); base = v.getVideoPlaybackQuality(); } });
v.addEventListener('error', () => { clearInterval(timer); document.title = 'VAT error media ' + (v.error ? v.error.code + ' ' + v.error.message : ''); });
next();
</script>
